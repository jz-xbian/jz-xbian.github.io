<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JZ_X</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #1a1a1a;
    color: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .card { width: 100%; max-width: 520px; text-align: center; }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%;
    background: linear-gradient(135deg, #5a8f4e, #8fc47f);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: bold; letter-spacing: 1px; color: #14210f;
    margin: 0 auto 22px;
    box-shadow: 0 0 0 4px #262626;
  }
  h1 {
    font-size: 42px; color: #8fc47f; letter-spacing: 5px;
    text-shadow: 2px 2px 0 #000;
  }
  .tagline { color: #888; margin: 12px 0 30px; font-size: 15px; }
  .about {
    background: #232323;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 22px 24px;
    text-align: left;
    margin-bottom: 26px;
  }
  .about h2 {
    font-size: 13px; color: #5a8f4e; letter-spacing: 3px;
    margin-bottom: 14px; text-transform: uppercase;
  }
  .about p { color: #ccc; line-height: 1.9; font-size: 15px; }
  .about p + p { margin-top: 8px; color: #999; }
  .links { display: flex; flex-direction: column; gap: 14px; }
  .btn {
    display: block; padding: 15px;
    background: #262626; color: #fff; text-decoration: none;
    border: 2px solid #3a3a3a; border-radius: 10px;
    font-size: 16px; transition: 0.2s;
  }
  .btn:hover {
    background: #5a8f4e; border-color: #8fc47f;
    transform: translateY(-2px);
  }
  .btn.secondary:hover { background: #b8860b; border-color: #ffd700; }
  .mail {
    display: inline-block; margin-top: 26px;
    color: #777; font-size: 14px; text-decoration: none;
    transition: 0.2s;
  }
  .mail:hover { color: #8fc47f; }
  footer { margin-top: 34px; color: #444; font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="card">

  <div class="avatar">JZ</div>
  <h1>JZ_X</h1>
  <p class="tagline">JZ神的领域 · 欢迎来到我的网络空间</p>

  <div class="about">
    <h2>关于我</h2>
    <p>喜欢折腾服务器，也喜欢研究《我的世界》服务器的部署。</p>
    <p>从开服、调优到挡住那些扫描机器人，该踩的坑基本都踩过一遍。</p>
  </div>

  <div class="links">
    <a href="https://jz-xbian.github.io/door-datapack/v1.1" class="btn">🚪 更高级的门合成数据包</a>
    <a href="https://github.com/jz-xbian" class="btn secondary">💻 访问我的 GitHub 主页</a>
  </div>

  <a class="mail" href="mailto:jaredzhang945@gmail.com">📮 jaredzhang945@gmail.com</a>

  <footer>© 2026 JZ_X</footer>

</div>
</body>
</html>
